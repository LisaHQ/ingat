# fx-web fixture: a stateless static site served by the fx-lite fixture script in web mode.
services:
  site:
    image: ${FXWEB_IMAGE:?}
    entrypoint: ["env"]
    command: ["fx-lite", "web"]
    user: "10001:10001"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    environment:
      RELEASE: ${FXWEB_RELEASE:?}
    ports: ["127.0.0.1:${FXWEB_PORT:?}:8080"]
    restart: unless-stopped
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}
